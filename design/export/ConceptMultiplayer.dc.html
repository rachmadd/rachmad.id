<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#0b0b0d}</style>
</helmet>
<div ref="{{ root }}" style="position:relative;width:100%;aspect-ratio:16/10;background:#151518;overflow:hidden;font-family:'Geist Mono', ui-monospace, monospace;color:#edf2f4">
  <div style="position:absolute;left:0;top:0;width:640px;height:400px;transform-origin:0 0;transform:scale({{ s }})">
    <div style="position:absolute;left:170px;top:98px;width:80px;height:1px;background:rgba(141,153,174,.55)"></div>
    <div style="position:absolute;left:390px;top:98px;width:80px;height:1px;background:rgba(141,153,174,.55)"></div>
    <div style="position:absolute;left:320px;top:126px;height:74px;border-left:1px dashed rgba(141,153,174,.5)"></div>
    <div style="position:absolute;left:540px;top:126px;height:74px;border-left:1px dashed rgba(141,153,174,.5)"></div>
    <div style="position:absolute;left:330px;top:154px;font-size:11px;color:#8d99ae">log stream</div>

    <div style="position:absolute;left:30px;top:70px;width:140px;height:56px;box-sizing:border-box;border-radius:16px;border:1px solid {{ v.cB }};background:{{ v.cBg }}">
      <div style="position:absolute;left:16px;top:10px;font-size:14px;line-height:18px">game client</div>
      <div style="position:absolute;left:16px;top:31px;font-size:11.5px;line-height:14px;color:#8d99ae">player p-2391</div>
    </div>
    <div style="position:absolute;left:250px;top:70px;width:140px;height:56px;box-sizing:border-box;border-radius:16px;border:1px solid {{ v.mB }};background:{{ v.mBg }}">
      <div style="position:absolute;left:16px;top:10px;font-size:14px;line-height:18px">matchmaking</div>
      <div style="position:absolute;left:16px;top:31px;font-size:11.5px;line-height:14px;color:#8d99ae;opacity:{{ v.queue }}">queue · 3/4</div>
      <div style="position:absolute;left:16px;top:31px;font-size:11.5px;line-height:14px;color:#edf2f4;opacity:{{ v.found }}">match · 4/4</div>
    </div>
    <div style="position:absolute;left:470px;top:70px;width:140px;height:56px;box-sizing:border-box;border-radius:16px;border:1px solid {{ v.sB }};background:{{ v.sBg }}">
      <div style="position:absolute;left:16px;top:10px;font-size:14px;line-height:18px">game session</div>
      <div style="position:absolute;left:16px;top:31px;font-size:11.5px;line-height:14px;color:#8d99ae;opacity:{{ v.wait }}">waiting</div>
      <div style="position:absolute;left:16px;top:31px;font-size:11.5px;line-height:14px;color:#edf2f4;opacity:{{ v.live }}">ds-8f2a · live</div>
    </div>

    <div style="position:absolute;left:30px;top:200px;width:580px;height:170px;box-sizing:border-box;border-radius:16px;background:#101013;border:1px solid rgba(255,255,255,.1)">
      <div style="position:absolute;left:18px;top:13px;font-size:11px;line-height:14px;color:#8d99ae">web console · live logs</div>
      <div style="position:absolute;right:18px;top:17px;width:6px;height:6px;border-radius:50%;background:#ef233c;opacity:{{ v.pulse }}"></div>
      <div style="position:absolute;left:0;right:0;top:38px;height:1px;background:rgba(255,255,255,.08)"></div>
      <div style="position:absolute;left:18px;top:48px;width:544px;height:112px;overflow:hidden">
        <sc-for list="{{ logs }}" as="l" hint-placeholder-count="6">
          <div style="position:absolute;left:0;top:{{ l.y }}px;display:flex;gap:16px;font-size:13px;line-height:22px;white-space:nowrap;opacity:{{ l.o }}">
            <span style="color:#8d99ae">{{ l.time }}</span>
            <span style="color:#8d99ae;width:20px">{{ l.src }}</span>
            <span>{{ l.msg }}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="position:absolute;left:{{ d.x }}px;top:{{ d.y }}px;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#ef233c;opacity:{{ d.o }}"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:600},&quot;reducedMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const DUR = 5, STATIC = 2.3;
const cl = v => Math.max(0, Math.min(1, v));
const ramp = (t, a, b) => cl((t - a) / (b - a));
const win = (t, a, b, f = 0.15) => ramp(t, a, a + f) * (1 - ramp(t, b - f, b));
const ease = v => v < .5 ? 2 * v * v : 1 - Math.pow(-2 * v + 2, 2) / 2;
const along = (kf, t) => { for (let i = 0; i < kf.length - 1; i++) { const [t0, x0, y0] = kf[i], [t1, x1, y1] = kf[i + 1]; if (t >= t0 && t < t1) { const e = ease((t - t0) / (t1 - t0)); return { x: x0 + (x1 - x0) * e, y: y0 + (y1 - y0) * e }; } } const l = kf[kf.length - 1]; return { x: l[1], y: l[2] }; };
const hb = v => `rgba(237,242,244,${(0.1 + 0.45 * v).toFixed(3)})`;
const hbg = v => `rgba(237,242,244,${(0.02 + 0.07 * v).toFixed(3)})`;
const KF = [[0,170,98],[0.2,170,98],[1.0,250,98],[1.8,390,98],[2.6,470,98],[5,470,98]];
const LOG = [
  ['00:01.204', 'mm', 'ticket queued  p-2391'],
  ['00:01.880', 'mm', 'match found  4/4 players'],
  ['00:02.116', 'ds', 'session ds-8f2a created'],
  ['00:02.430', 'ds', 'players joined  4/4'],
  ['00:03.002', 'ds', 'tick 60hz  rtt 38ms'],
  ['00:03.611', 'mm', 'ticket queued  p-2392'],
];

class Component extends DCLogic {
  state = { t: STATIC, s: 1 };
  root = React.createRef();
  get reduced() { return !!this.props.reducedMotion || window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  componentDidMount() {
    this.measure = () => { let el = this.root.current; while (el && el.parentElement && el.getBoundingClientRect().width < 2) el = el.parentElement; const w = el ? el.getBoundingClientRect().width : 0; const sc = w / 640; if (sc && Math.abs(sc - this.state.s) > 0.002) this.setState({ s: sc }); };
    try { this.ro = new ResizeObserver(() => this.measure()); this.ro.observe(this.root.current); } catch (e) {}
    setTimeout(this.measure, 0);
    this.start();
  }
  componentDidUpdate(pp) { if (this.reduced) this.measure(); if (pp.reducedMotion !== this.props.reducedMotion) { this.stop(); this.start(); } }
  componentWillUnmount() { this.stop(); this.ro && this.ro.disconnect(); }
  start() {
    if (this.reduced) { this.setState({ t: STATIC }); return; }
    const t0 = performance.now(); let last = 0;
    const loop = now => { if (now - last > 30) { last = now; this.measure(); this.setState({ t: ((now - t0) / 1000) % DUR }); } this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  }
  stop() { cancelAnimationFrame(this.raf); }
  renderVals() {
    const t = this.state.t;
    const client = cl(1 - ramp(t, 0.3, 0.8) + ramp(t, 4.6, 5.0));
    const mm = win(t, 1.0, 2.0), ses = win(t, 2.6, 3.8);
    const found = ramp(t, 1.4, 1.6) * (1 - ramp(t, 4.5, 4.9));
    const live = ramp(t, 2.6, 2.8) * (1 - ramp(t, 4.5, 4.9));
    const p = along(KF, t);
    const k = t / (DUR / 6), base = Math.floor(k), e = ease(cl((k - base) / 0.3));
    const logs = [0, 1, 2, 3, 4, 5].map(j => {
      const [time, src, msg] = LOG[(base + j) % 6];
      const o = j === 5 ? e : j === 4 ? 1 - 0.38 * e : j === 0 ? 0.62 * (1 - e) : 0.62;
      return { time, src, msg, y: (j - e) * 22, o };
    });
    return {
      root: this.root, s: this.state.s, logs,
      d: { x: p.x, y: p.y, o: win(t, 0.1, 1.05, 0.1) + win(t, 1.75, 2.65, 0.1) },
      v: {
        cB: hb(client), cBg: hbg(client), mB: hb(mm), mBg: hbg(mm), sB: hb(ses), sBg: hbg(ses),
        queue: 1 - found, found, wait: 1 - live, live,
        pulse: 0.45 + 0.55 * (0.5 + 0.5 * Math.cos(t / DUR * Math.PI * 2 * 5)),
      },
    };
  }
}
</script>
</body>
</html>
