<div ref="{{ root }}" style="position:relative;width:100%;aspect-ratio:16/10;background:#151518;overflow:hidden;font-family:'Geist Mono', ui-monospace, monospace;color:#edf2f4">
  <div style="position:absolute;left:0;top:0;width:640px;height:400px;transform-origin:0 0;transform:scale({{ s }})">
    <div style="position:absolute;left:24px;top:64px;width:592px;height:196px;box-sizing:border-box;border-radius:20px;background:#1a1a1e;border:1px solid rgba(255,255,255,.1)"></div>
    <div style="position:absolute;left:44px;top:78px;font-size:11px;line-height:14px;color:#8d99ae">app shell · router</div>
    <div style="position:absolute;left:94px;top:110px;width:448px;height:1px;background:rgba(141,153,174,.55)"></div>
    <div style="position:absolute;left:94px;top:110px;width:1px;height:26px;background:rgba(141,153,174,.55)"></div>
    <div style="position:absolute;left:206px;top:110px;width:1px;height:26px;background:rgba(141,153,174,.55)"></div>
    <div style="position:absolute;left:318px;top:110px;width:1px;height:26px;background:rgba(141,153,174,.55)"></div>
    <div style="position:absolute;left:430px;top:110px;width:1px;height:26px;background:rgba(141,153,174,.55)"></div>
    <div style="position:absolute;left:542px;top:110px;width:1px;height:26px;background:rgba(141,153,174,.55)"></div>
    <div style="position:absolute;left:94px;top:236px;width:1px;height:70px;background:rgba(141,153,174,.4)"></div>
    <div style="position:absolute;left:206px;top:236px;width:1px;height:70px;background:rgba(141,153,174,.4)"></div>
    <div style="position:absolute;left:318px;top:236px;width:1px;height:70px;background:rgba(141,153,174,.4)"></div>
    <div style="position:absolute;left:430px;top:236px;width:1px;height:70px;background:rgba(141,153,174,.4)"></div>
    <div style="position:absolute;left:542px;top:236px;width:1px;height:70px;background:rgba(141,153,174,.4)"></div>

    <div style="position:absolute;left:44px;top:136px;width:100px;height:100px;box-sizing:border-box;border-radius:14px;background:{{ v.tBg }};border:1px solid {{ v.tB }}">
      <div style="position:absolute;left:12px;top:10px;font-size:14px">teller</div>
      <div style="position:absolute;left:12px;top:72px;font-size:10.5px;color:#8d99ae;opacity:{{ v.tReady }}">ready</div>
      <div style="position:absolute;left:12px;top:72px;font-size:10.5px;color:#8d99ae;opacity:{{ v.tPend }}">txn · pending</div>
      <div style="position:absolute;left:12px;top:72px;font-size:10.5px;color:#edf2f4;opacity:{{ v.tOk }}">approved</div>
    </div>
    <div style="position:absolute;left:156px;top:136px;width:100px;height:100px;box-sizing:border-box;border-radius:14px;background:rgba(237,242,244,.02);border:1px solid rgba(237,242,244,.1)">
      <div style="position:absolute;left:12px;top:10px;font-size:14px">acct-open</div>
    </div>
    <div style="position:absolute;left:268px;top:136px;width:100px;height:100px;box-sizing:border-box;border-radius:14px;background:rgba(237,242,244,.02);border:1px solid rgba(237,242,244,.1)">
      <div style="position:absolute;left:12px;top:10px;font-size:14px">deposit</div>

    <div style="position:absolute;left:380px;top:136px;width:100px;height:100px;box-sizing:border-box;border-radius:14px;background:rgba(237,242,244,.02);border:1px solid rgba(237,242,244,.1)">
      <div style="position:absolute;left:12px;top:10px;font-size:14px">intl-xfer</div>

    <div style="position:absolute;left:492px;top:136px;width:100px;height:100px;box-sizing:border-box;border-radius:14px;background:{{ v.mBg }};border:1px solid {{ v.mB }}">
      <div style="position:absolute;left:12px;top:10px;font-size:14px">mgr-auth</div>
      <div style="position:absolute;left:12px;top:72px;font-size:10.5px;color:#8d99ae;opacity:{{ v.mIdle }}">idle</div>
      <div style="position:absolute;left:12px;top:72px;font-size:10.5px;color:#8d99ae;opacity:{{ v.mRev }}">reviewing</div>
      <div style="position:absolute;left:12px;top:72px;font-size:10.5px;color:#edf2f4;opacity:{{ v.mOk }}">approved</div>

    <div style="position:absolute;left:44px;top:306px;width:100px;height:44px;box-sizing:border-box;border-radius:22px;border:1px solid rgba(237,242,244,.1);text-align:center;font-size:12.5px;line-height:42px;color:#edf2f4">teller-svc</div>
    <div style="position:absolute;left:156px;top:306px;width:100px;height:44px;box-sizing:border-box;border-radius:22px;border:1px solid rgba(237,242,244,.1);text-align:center;font-size:12.5px;line-height:42px;color:#edf2f4">acct-svc</div>
    <div style="position:absolute;left:268px;top:306px;width:100px;height:44px;box-sizing:border-box;border-radius:22px;border:1px solid rgba(237,242,244,.1);text-align:center;font-size:12.5px;line-height:42px;color:#edf2f4">dep-svc</div>
    <div style="position:absolute;left:380px;top:306px;width:100px;height:44px;box-sizing:border-box;border-radius:22px;border:1px solid rgba(237,242,244,.1);text-align:center;font-size:12.5px;line-height:42px;color:#edf2f4">xfer-svc</div>
    <div style="position:absolute;left:492px;top:306px;width:100px;height:44px;box-sizing:border-box;border-radius:22px;border:1px solid {{ v.aB }};background:{{ v.aBg }};text-align:center;font-size:12.5px;line-height:42px;color:#edf2f4">auth-svc</div>

    <div style="position:absolute;left:{{ d.x }}px;top:{{ d.y }}px;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#ef233c;opacity:{{ d.o }}"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:600},&quot;reducedMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const DUR = 6, STATIC = 3.3;
const cl = v => Math.max(0, Math.min(1, v));
const ramp = (t, a, b) => cl((t - a) / (b - a));
const win = (t, a, b, f = 0.15) => ramp(t, a, a + f) * (1 - ramp(t, b - f, b));
const ease = v => v < .5 ? 2 * v * v : 1 - Math.pow(-2 * v + 2, 2) / 2;
const along = (kf, t) => { for (let i = 0; i < kf.length - 1; i++) { const [t0, x0, y0] = kf[i], [t1, x1, y1] = kf[i + 1]; if (t >= t0 && t < t1) { const e = ease((t - t0) / (t1 - t0)); return { x: x0 + (x1 - x0) * e, y: y0 + (y1 - y0) * e }; } } const l = kf[kf.length - 1]; return { x: l[1], y: l[2] }; };
const hb = v => `rgba(237,242,244,${(0.1 + 0.45 * v).toFixed(3)})`;
const hbg = v => `rgba(237,242,244,${(0.02 + 0.07 * v).toFixed(3)})`;
const KF = [[0,94,136],[0.5,94,136],[1.0,94,110],[2.2,542,110],[2.5,542,136],[2.8,542,236],[3.1,542,306],[3.5,542,236],[3.8,542,136],[4.0,542,110],[5.0,94,110],[5.2,94,136],[6,94,136]];

class Component extends DCLogic {
  state = { t: STATIC, s: 1 };
  root = React.createRef();
  get reduced() { return !!this.props.reducedMotion || window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  componentDidMount() {
    this.measure = () => { let el = this.root.current; while (el && el.parentElement && el.getBoundingClientRect().width < 2) el = el.parentElement; const w = el ? el.getBoundingClientRect().width : 0; const sc = w / 640; if (sc && Math.abs(sc - this.state.s) > 0.002) this.setState({ s: sc }); };
    try { this.ro = new ResizeObserver(() => this.measure()); this.ro.observe(this.root.current); } catch (e) {}
    setTimeout(this.measure, 0);
    this.start();
  }
  componentDidUpdate(pp) { if (this.reduced) this.measure(); if (pp.reducedMotion !== this.props.reducedMotion) { this.stop(); this.start(); } }
  componentWillUnmount() { this.stop(); this.ro && this.ro.disconnect(); }
  start() {
    if (this.reduced) { this.setState({ t: STATIC }); return; }
    const t0 = performance.now(); let last = 0;
    const loop = now => { if (now - last > 30) { last = now; this.measure(); this.setState({ t: ((now - t0) / 1000) % DUR }); } this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  }
  stop() { cancelAnimationFrame(this.raf); }
  renderVals() {
    const t = this.state.t;
    const th = cl(1 - ramp(t, 0.6, 1.0) + ramp(t, 5.1, 5.3));
    const tPend = ramp(t, 0.1, 0.3) * (1 - ramp(t, 5.1, 5.3));
    const tOk = ramp(t, 5.1, 5.3) * (1 - ramp(t, 5.7, 6.0));
    const mh = win(t, 2.45, 4.0);
    const mRev = ramp(t, 2.5, 2.7) * (1 - ramp(t, 3.4, 3.6));
    const mOk = ramp(t, 3.4, 3.6) * (1 - ramp(t, 5.0, 5.4));
    const ah = win(t, 3.0, 3.6);
    const p = along(KF, t);
    return {
      root: this.root, s: this.state.s,
      d: { x: p.x, y: p.y, o: win(t, 0.4, 2.55, 0.1) + win(t, 2.75, 3.55, 0.1) + win(t, 3.75, 5.25, 0.1) },
      v: {
        tB: hb(th), tBg: hbg(th), tReady: 1 - tPend - tOk, tPend, tOk,
        mB: hb(mh), mBg: hbg(mh), mIdle: 1 - mRev - mOk, mRev, mOk,
        aB: hb(ah), aBg: hbg(ah),
      },
    };
  }
}
</script>
</body>
</html>
